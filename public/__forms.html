<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Formulario de contacto</title>
  </head>
  <body>
    <!-- Static copy of the contact form so Netlify Forms can detect it at deploy time.
         Real submissions are posted here by server/api/contact.post.ts. -->
    <form name="contacto" method="POST" data-netlify="true" hidden>
      <input type="text" name="name">
      <input type="email" name="email">
      <input type="tel" name="phone">
      <input type="text" name="company">
      <input type="text" name="role">
      <textarea name="need"></textarea>
    </form>
  </body>
</html>
