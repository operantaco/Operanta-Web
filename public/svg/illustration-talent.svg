<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>Talento: equipos, desarrollo y trayectoria profesional</title>
  <defs>
    <linearGradient id="tal-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#E3F4F3"/>
    </linearGradient>
    <linearGradient id="tal-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FD8D3"/>
      <stop offset="1" stop-color="#12B0A8"/>
    </linearGradient>
    <linearGradient id="tal-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27406B"/>
      <stop offset="1" stop-color="#13233F"/>
    </linearGradient>
    <linearGradient id="tal-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12B0A8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#12B0A8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tal-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#13233F" fill-opacity="0.12"/>
    </pattern>
    <filter id="tal-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#13233F" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#tal-bg)"/>
  <rect width="400" height="300" rx="16" fill="url(#tal-dots)"/>
  <circle cx="80" cy="60" r="90" fill="#12B0A8" fill-opacity="0.07"/>
  <circle cx="340" cy="250" r="80" fill="#F4A340" fill-opacity="0.09"/>

  <!-- team network -->
