    <g>
    <circle cx="242" cy="168" r="25" fill="#fff" stroke="#D5DDE8" stroke-width="1.5"/>
    <circle cx="242" cy="162.96" r="6.4799999999999995" fill="#12B0A8"/>
    <path d="M230.84 180.96a11.16 9.36 0 0 1 22.32 0z" fill="#12B0A8"/>
    <circle cx="256.04" cy="153.96" r="3.6" fill="#F4A340" stroke="#fff" stroke-width="2"/>
  </g>
  </g>

