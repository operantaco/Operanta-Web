    <circle cx="133.6" cy="88.4" r="4" fill="#12B0A8" stroke="#fff" stroke-width="2"/>
  </g>
    <g>
    <circle cx="282" cy="104" r="27" fill="#fff" stroke="#D5DDE8" stroke-width="1.5"/>
    <circle cx="282" cy="98.4" r="7.199999999999999" fill="#27406B"/>
    <path d="M269.6 118.4a12.4 10.4 0 0 1 24.8 0z" fill="#27406B"/>
    <circle cx="297.6" cy="88.4" r="4" fill="#12B0A8" stroke="#fff" stroke-width="2"/>
  </g>
    <g>
