<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img">
  <title>Operaciones: logística, indicadores y distribución</title>
  <defs>
    <linearGradient id="ops-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#E3F4F3"/>
    </linearGradient>
    <linearGradient id="ops-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FD8D3"/>
      <stop offset="1" stop-color="#12B0A8"/>
    </linearGradient>
    <linearGradient id="ops-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27406B"/>
      <stop offset="1" stop-color="#13233F"/>
    </linearGradient>
    <linearGradient id="ops-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12B0A8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#12B0A8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ops-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#13233F" fill-opacity="0.12"/>
    </pattern>
    <filter id="ops-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#13233F" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#ops-bg)"/>
  <rect width="400" height="300" rx="16" fill="url(#ops-dots)"/>
  <circle cx="320" cy="60" r="90" fill="#12B0A8" fill-opacity="0.07"/>
  <circle cx="60" cy="250" r="70" fill="#F4A340" fill-opacity="0.08"/>

  <!-- KPI dashboard -->
  <g filter="url(#ops-shadow)">
    <rect x="196" y="28" width="184" height="128" rx="12" fill="#fff"/>
  </g>
  <circle cx="212" cy="44" r="3.5" fill="#F4A340"/>
  <circle cx="224" cy="44" r="3.5" fill="#12B0A8"/>
  <circle cx="236" cy="44" r="3.5" fill="#D5DDE8"/>
  <rect x="268" y="40" width="96" height="8" rx="4" fill="#D5DDE8"/>
  <g transform="translate(212 60)">
    <path d="M0 62 L26 52 L52 56 L78 38 L104 42 L130 22 L156 14 L156 80 L0 80 Z" fill="url(#ops-area)"/>
    <path d="M0 62 L26 52 L52 56 L78 38 L104 42 L130 22 L156 14" stroke="#12B0A8" stroke-width="3"/>
    <circle cx="156" cy="14" r="6" fill="#fff" stroke="#F4A340" stroke-width="3"/>
    <path d="M0 80h156" stroke="#D5DDE8" stroke-width="1.5"/>
  </g>
  <g transform="translate(330 96)">
    <rect x="0" y="0" width="38" height="46" rx="8" fill="#13233F"/>
    <path d="M9 31l7-7 5 4 9-11" stroke="#7FD8D3" stroke-width="3"/>
    <path d="M22 17h8v8" stroke="#7FD8D3" stroke-width="3"/>
  </g>

  <!-- floor -->
  <ellipse cx="110" cy="236" rx="96" ry="18" fill="#13233F" fill-opacity="0.07"/>
  <ellipse cx="300" cy="262" rx="82" ry="10" fill="#13233F" fill-opacity="0.08"/>

  <!-- pallet + boxes -->
  <g>
    <polygon points="62,226 116,196 170,226 116,256" fill="#C9D4E3"/>
    <polygon points="62,226 116,256 116,262 62,232" fill="#9BA9BF"/>
    <polygon points="170,226 116,256 116,262 170,232" fill="#7D8CA6"/>
  </g>
  <g>
    <polygon points="58,205 88,222 88,256 58,239" fill="#F4A340"/>
    <polygon points="88,222 118,205 118,239 88,256" fill="#E08A22"/>
    <polygon points="88,188 118,205 88,222 58,205" fill="#FFD9A0"/>
    
  </g>
  <g>
    <polygon points="114,205 144,222 144,256 114,239" fill="#12B0A8"/>
    <polygon points="144,222 174,205 174,239 144,256" fill="#0B8F89"/>
    <polygon points="144,188 174,205 144,222 114,205" fill="#9BE3DE"/>
    
  </g>
  <g>
    <polygon points="86,173 116,190 116,220 86,203" fill="#27406B"/>
    <polygon points="116,190 146,173 146,203 116,220" fill="#13233F"/>
    <polygon points="116,156 146,173 116,190 86,173" fill="#4A6597"/>
    
  </g>
  <g>
    <polygon points="94,130 116,142 116,166 94,154" fill="#F4A340"/>
    <polygon points="116,142 138,130 138,154 116,166" fill="#E08A22"/>
    <polygon points="116,118 138,130 116,142 94,130" fill="#FFD9A0"/>
    
  </g>

  <!-- flow arrow -->
  <path d="M176 232c28 8 46 4 68-6" stroke="#12B0A8" stroke-width="3" stroke-dasharray="1 9"/>
  <path d="M236 218l12 6-10 9" stroke="#12B0A8" stroke-width="3.5"/>

  <!-- truck -->
  <g transform="translate(252 190)" filter="url(#ops-shadow)">
    <rect x="0" y="0" width="82" height="52" rx="6" fill="url(#ops-teal)"/>
    <rect x="12" y="14" width="26" height="4" rx="2" fill="#fff" fill-opacity="0.8"/>
    <rect x="12" y="24" width="40" height="4" rx="2" fill="#fff" fill-opacity="0.5"/>
    <path d="M86 14h26a6 6 0 0 1 5 3l11 16a6 6 0 0 1 1 3v16H86z" fill="url(#ops-navy)"/>
    <path d="M94 22h20l9 12H94z" fill="#BFE9E6"/>
    <rect x="86" y="52" width="46" height="4" fill="#13233F"/>
  </g>
  <g>
    <circle cx="276" cy="246" r="12" fill="#13233F"/><circle cx="276" cy="246" r="5" fill="#E8EEF6"/>
    <circle cx="364" cy="246" r="12" fill="#13233F"/><circle cx="364" cy="246" r="5" fill="#E8EEF6"/>
  </g>
</svg>
